<!--blog.html-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.2.12/marked.min.js"></script>

    <title>weblog</title>

</head>

<body>

    <nav>
        <a href="index.html">home</a>
        <a href="blog.html">blog</a>
    </nav>

    <h1>blog</h1>

    <div class="blog-container">
        <ul id="post-list"></ul>
        <div id="post-content"></div>
    </div>

    <!--chat area-->
    <div id="chat-container">
        <div id="chat-messages" style="border:1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll;"></div>

        <!-- lower bar -->
        <div id="chat-controls">
            <button id="profile-btn"style="margin-right: 10px;">P</button>
            <input id="chat-input" type="text" placeholder="type your message..." maxlength="280" style="flex: 1;"/>
            <button id="send-btn">Send</button>
        </div>

        <!-- profile popup -->
        <div id="profile-popup"
             style="display:none; position: fixed; top: 30%; left: 50%; transform: translate(-50%, -30%);
              background: #fff; border: 1px solid #ccc; padding: 20px; z-index: 1000;">

            <label for="username-input">username:</label>
            <input id="username-input" type="text" placeholder="anon" maxlength="20">
            <button id="profile-ok">ok</button>
            <button id="profile-cancel">cancel</button>

        </div>

    </div>

    <script type="module" src="js/chat.js"></script>
    <script type="module" src="js/blog.js"></script>

</body>

</html>
