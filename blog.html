<!--blog.html-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <title>weblog</title>

</head>

<body>

    <div class="blog-container">

        <!--sidebar-->
        <div id="sidebar-placeholder"></div>

        <div id="post-display-container">

            <button id="return-btn">return</button>

            <!--lace border-->
            <div class="lace-container">

                <!-- corners -->
                <div class="lace corner top-left"></div>
                <div class="lace corner top-right"></div>
                <div class="lace corner bottom-right"></div>
                <div class="lace corner bottom-left"></div>

                <!-- sides -->
                <div class="lace side top"></div>
                <div class="lace side right"></div>
                <div class="lace side bottom"></div>
                <div class="lace side left"></div>

                <div id="post-content"></div>
            </div>

            <!--chat area-->
            <div id="chat-container">


                <div id="chat-header-container">
                    <p id="chat-info"></p>
                </div>


                <div id="chat-main">

                    <div id="chat-messages"></div>

                    <div id="chat-user-info">

                        <label for="username-input">username:</label>
                        <input id="username-input" type="text" placeholder="anon" maxlength="20">


                        <label>colour:</label>
                        <div id="colour-options">
                            <div class="colour-option" data-colour="#d590b7"></div> <!-- pink -->
                            <div class="colour-option" data-colour="#d5bc90"></div> <!-- orange -->
                            <div class="colour-option" data-colour="#d5d090"></div> <!-- yellow -->
                            <div class="colour-option" data-colour="#90d5ae"></div> <!-- green -->
                            <div class="colour-option" data-colour="#90d5d1"></div> <!-- miku -->
                            <div class="colour-option" data-colour="#9095d5"></div> <!-- blue -->
                            <div class="colour-option" data-colour="#ae90d5"></div> <!-- purple -->
                        </div>

                    </div>

                    <!-- login button -->
                    <div id="login-prompt" style="display: none; margin-top: 8px;">
                        <button id="google-login-btn">Log in with Google to comment</button>
                    </div>

                    <!-- lower bar -->
                    <div id="chat-controls">
                        <textarea id="chat-input" type="text"
                                  placeholder="type your message..."
                                  maxlength="280" wrap="soft"
                                  rows="2"></textarea>

                        <div id="reply-tag" style="display:none; font-size:0.9em; margin-top:0.25rem;">
                            replying to <span id="reply-tag-id"></span>
                            <button id="clear-reply" style="margin-left:0.5rem;">✕</button>
                        </div>

                        <button id="send-btn">send</button>


                    </div>
                </div>

                <!-- profile popup -->

            </div>
        </div>

        <!-- post-list -->
        <div id="right-column">
            <div id="tag-filter"></div>
            <div id="post-list-container">
                <ul id="post-list"></ul>
            </div>
        </div>
    </div>

    <script type="module" src="js/chat.js"></script>
    <script type="module" src="js/blog.js"></script>
    <script type="module" src="js/sidebar.js"></script>

</body>

</html>
