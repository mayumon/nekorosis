<!--blog.html-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <title>weblog</title>

</head>

<body>

    <div class="blog-container">

        <!--sidebar-->
        <div id="sidebar-placeholder"></div>

        <div id="post-display-container">

            <button id="return-btn">return</button>

            <!--lace border-->
            <div class="lace-container">

                <!-- corners -->
                <div class="lace corner top-left"></div>
                <div class="lace corner top-right"></div>
                <div class="lace corner bottom-right"></div>
                <div class="lace corner bottom-left"></div>

                <!-- sides -->
                <div class="lace side top"></div>
                <div class="lace side right"></div>
                <div class="lace side bottom"></div>
                <div class="lace side left"></div>

                <div id="post-content"></div>
            </div>

            <!--chat area-->
            <div id="chat-container">
                <h2 id="chat-header">comments</h2>
                <div id="chat-messages"></div>

                <!-- lower bar -->
                <div id="chat-controls">
                    <button id="profile-btn">P</button>
                    <input id="chat-input" type="text" placeholder="type your message..." maxlength="280">
                    <button id="send-btn">Send</button>
                </div>

                <!-- profile popup -->
                <div id="profile-popup">

                    <label for="username-input">username:</label>
                    <input id="username-input" type="text" placeholder="anon" maxlength="20">

                    <br>

                    <label>colour:</label>
                    <div id="colour-options">
                        <div class="colour-option" data-colour="#ff0091"></div>
                        <div class="colour-option" data-colour="#c000ff"></div>
                        <div class="colour-option" data-colour="#4a00ff"></div>
                        <div class="colour-option" data-colour="#3fff00"></div>
                    </div>

                    <br>

                    <button id="profile-ok">ok</button>
                    <button id="profile-cancel">cancel</button>

                </div>
            </div>
        </div>

        <!-- post-list -->
        <div id="right-column">
            <div id="tag-filter"></div>
            <div id="post-list-container">
                <ul id="post-list"></ul>
            </div>
        </div>
    </div>

    <script type="module" src="js/chat.js"></script>
    <script type="module" src="js/blog.js"></script>
    <script type="module" src="js/sidebar.js"></script>

</body>

</html>
