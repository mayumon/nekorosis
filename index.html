<!--index.html-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <title>Title</title>

</head>

<body>

    <div class="home-container">
        <div id="sidebar-placeholder"></div>

        <p>im a buff baby that can dance like a man</p>


        <h2>♡˚. guestbook</h2>

        <div id="guestbook-login-prompt" style="margin-bottom: 1rem; display: none;">
            <button id="guestbook-google-login-btn">Log in with Google to sign</button>
        </div>

        <!-- main guestbook UI: name + message inputs, draggable icons, and drop zone -->
        <div id="guestbook-ui" style="display: none;">

            <!-- name + message -->
            <div id="guestbook-form" style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">

                <!-- name -->
                <div>
                    <label for="guest-name" style="display: block;">Your name:</label>
                    <input id="guest-name"
                           placeholder="your name..."
                           type="text"
                           maxlength="20"
                           style="padding: 0.3rem 0.5rem; font-family: inherit; font-size: 1rem;">
                </div>

                <!-- message -->
                <div style="flex: 1;">

                    <label for="guest-text"
                           style="display: block;">short message:</label>
                    <textarea id="guest-text"
                              type="text"
                              placeholder="write a message!!"
                              maxlength="280"
                              style="width: 100%; padding: 0.3rem 0.5rem; font-family: inherit; font-size: 1rem;"></textarea>
                </div>

                <!-- icon chooser -->
                <div id="icon-chooser-wrapper" style="display:flex; align-items:center; gap:0.5rem;">
                    <!-- preview of the currently selected icon (blank at first) -->
                    <img id="selected-icon-preview"
                         src=""
                         alt=""
                         style="width:32px; height:32px; object-fit:contain; visibility:hidden; border:1px solid #ccc;"/>
                    <button type="button" id="open-icon-picker">choose icon</button>
                </div>

            </div>

            <!-- draggable icons -->
            <div id="guestbook-icons" style="display:flex; gap:.5rem; margin-bottom:1rem;">

                <!-- drop‐zone -->
                <div id="guestbook-dropzone"
                     style="position: relative; width: 100%; height: 400px;
                border: 2px dashed #ccc; border-radius: 8px;
                background: url('assets/images/guestbook-bg.png') center/cover no-repeat;">
                    <span style="position: absolute; top: 50%; left: 50%;
                   transform: translate(-50%, -50%);
                   color: #888; font-size: 1.2rem;">
        Drag any icon here →
      </span>
                </div>
            </div>












        </div>


    <div class="hover-tooltip">

    </div>

    <div id="icon-picker-overlay" style="
     position:fixed; top:0; left:0; right:0; bottom:0;
     background:rgba(0,0,0,0.75);
     display:none;
     align-items:center; justify-content:center;
     z-index:2000;
">
        <div style="
        background:white;
        padding:1rem;
        border-radius:8px;
        max-height:80vh;
        overflow:auto;
      ">
            <button id="close-icon-picker" style="float:right;">×</button>
            <div id="icon-grid" style="
         display:grid;
         grid-template-columns:repeat(12,32px);
         gap:8px;
      ">
                <!-- JS inject 144 <img> tiles here -->
            </div>
        </div>
    </div>


    <script type="module" src="js/chat.js"></script>
    <script type="module" src="js/guestbook.js"></script>
    <script type="module" src="js/sidebar.js"></script>


</body>

</html>
