<!--index.html-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <title>nekorosis</title>
</head>

<div id="header-placeholder"></div>

<body>

<div class="home-container">
    <div id="sidebar-placeholder"></div>

    <div class="content-wrapper">

        <section id="featured-posts">
            <img src="assets/images/banner-index.png" alt="featured banner" id="featured-banner">

            <div class="post-squares">

                <!-- newest post card -->
                <div class="post-card" id="newest-post-card">
                    <div class="post-square">
                        <a id="newest-link" href="#">
                            <img src="" alt="newest post thumbnail" id="newest-thumb">
                        </a>
                        <div class="danmaku"></div>
                    </div>
                    <div class="square-title">
                        <div class="bubble-header">★ newest post</div>
                        <div class="bubble-text" id="newest-title"></div>
                    </div>
                </div>

                <!-- nano * radio  -->
                <div class="post-card" id="song-of-day-card">

                    <div class="post-square">
                        <a id="song-link" href="#" target="_blank" rel="noopener">
                            <img id="song-thumb" src="" alt="song of the day thumbnail">
                        </a>
                        <div class="danmaku"></div>
                    </div>

                    <div class="square-title">
                        <div class="bubble-header">♩ nano * radio 365</div>
                        <div class="bubble-text">
                            <span id="song-title">a song title!</span>
                        </div>
                    </div>

                </div>

                <!-- something else  -->
                <div class="post-card">
                    <div class="post-square"></div>

                    <div class="square-title">
                        <div class="bubble-header">★ something else</div>
                        <div class="bubble-text">i mean i dont know</div>
                    </div>
                </div>

            </div>
        </section>
















        <section id="highlight">
            <div class="highlight-container">
                <div class="highlight-box">
                    <p>text will go in here im not really sure of what yet but i guess something because i mean something has to go here no even if its this it has to go and even if its nothing. maybe. hmm food for thought</p>
                </div>
                <img
                        src="assets/images/cat-orange-hand.png"
                        alt="decorative"
                        class="highlight-image"
                />
            </div>
        </section>






















        <h2>♡˚. guestbook</h2>

        <!-- main guestbook ui: name + message inputs, draggable icons, and drop zone -->
        <div id="guestbook-ui">

            <!-- draggable icons -->
            <div id="guestbook-icons">

                <!-- drop‐zone -->
                <div id="guestbook-dropzone"></div>

            </div>

            <!-- name + message -->
            <div id="guestbook-form">
                <!-- icon chooser -->
                <div id="icon-chooser-wrapper">
                    <!-- preview of the currently selected icon (blank at first) -->
                    <img id="selected-icon-preview" src="" alt="">
                    <button type="button" id="open-icon-picker">choose icon</button>
                </div>

                <!-- name -->
                <div>
                    <label for="guest-name">your name:</label>
                    <input id="guest-name" placeholder="your name..." type="text" maxlength="20">
                </div>

                <!-- message -->
                <div>
                    <label for="guest-text">short message:</label>
                    <textarea id="guest-text" placeholder="write a message!!" maxlength="280"></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="hover-tooltip"></div>

<div id="icon-picker-overlay">
    <div>
        <button id="close-icon-picker">×</button>
        <div id="icon-grid">
            <!-- js inject 144 <img> tiles here -->
        </div>
    </div>
</div>

<script type="module" src="js/chat.js"></script>
<script type="module" src="js/guestbook.js"></script>
<script type="module" src="js/sidebar.js"></script>
<script type="module" src="js/header.js"></script>
<script type="module" src="js/index.js"></script>

</body>
</html>
