<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <title>nekorosis</title>
</head>

<div id="header-placeholder"></div>

<body>

<div class="home-container">
    <div id="sidebar-placeholder"></div>

    <div class="content-wrapper">

        <section id="featured-posts">
            <img src="assets/images/banner-index.png" alt="featured banner" id="featured-banner">

            <div class="post-squares">

                <!-- newest post card -->
                <div class="post-card" id="newest-post-card">
                    <div class="square-header">newest post</div>
                    <div class="post-square">
                        <img src="" alt="newest post thumbnail" id="newest-thumb">
                    </div>
                    <div class="square-title" id="newest-title"></div>
                </div>

                <!-- empty placeholders -->
                <div class="post-card">
                    <div class="square-header">song of the day</div>
                    <div class="post-square"></div>
                    <div class="square-title">cool person - cool song</div>
                </div>
                <div class="post-card">
                    <div class="square-header">something else</div>
                    <div class="post-square"></div>
                    <div class="square-title">i mean i dont know</div>
                </div>

            </div>
        </section>


        <h2>♡˚. guestbook</h2>

        <div id="guestbook-login-prompt">
            <button id="guestbook-google-login-btn">Log in with Google to sign</button>
        </div>

        <!-- main guestbook ui: name + message inputs, draggable icons, and drop zone -->
        <div id="guestbook-ui">

            <!-- draggable icons -->
            <div id="guestbook-icons">

                <!-- drop‐zone -->
                <div id="guestbook-dropzone"></div>

            </div>

            <!-- name + message -->
            <div id="guestbook-form">
                <!-- icon chooser -->
                <div id="icon-chooser-wrapper">
                    <!-- preview of the currently selected icon (blank at first) -->
                    <img id="selected-icon-preview" src="" alt="">
                    <button type="button" id="open-icon-picker">choose icon</button>
                </div>

                <!-- name -->
                <div>
                    <label for="guest-name">your name:</label>
                    <input id="guest-name" placeholder="your name..." type="text" maxlength="20">
                </div>

                <!-- message -->
                <div>
                    <label for="guest-text">short message:</label>
                    <textarea id="guest-text" placeholder="write a message!!" maxlength="280"></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="hover-tooltip"></div>

<div id="icon-picker-overlay">
    <div>
        <button id="close-icon-picker">×</button>
        <div id="icon-grid">
            <!-- JS inject 144 <img> tiles here -->
        </div>
    </div>
</div>

<script type="module" src="js/chat.js"></script>
<script type="module" src="js/guestbook.js"></script>
<script type="module" src="js/sidebar.js"></script>
<script type="module" src="js/header.js"></script>
<script type="module" src="js/index.js"></script>

</body>
</html>
