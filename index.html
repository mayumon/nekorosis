<html lang="en">

<body>
<main>
    <h1>nya</h1>
    <p class="intro">i need it to exist. there is 1 thing to do right now.</p>
    <div id="posts"></div>
</main>

<script src="posts.js"></script>
<script>
    const container = document.querySelector("#posts");

    posts
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        .forEach(post => {
            container.innerHTML += `
          <a class="post-card" href="posts/${post.slug}/">
            <img src="posts/${post.slug}/header.png" alt="">
            <div>
              <strong>${post.title}</strong>
              <small>${post.date}</small>
            </div>
          </a>
        `;
        });
</script>
