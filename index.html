<!--index.html-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <title>Title</title>

</head>

<body>

    <div class="home-container">
        <div id="sidebar-placeholder"></div>

        <p>im a buff baby that can dance like a man</p>











        <section id="guestbook-section" style="max-width: 800px; margin: 2rem auto;">

            <h2>guestbook</h2>

            <div id="guestbook-login-prompt" style="margin-bottom: 1rem; display: none;">
                <button id="guestbook-google-login-btn">Log in with Google to sign</button>
            </div>

            <!-- The main guestbook UI: name + message inputs, draggable icons, and drop zone -->
            <div id="guestbook-ui" style="display: none;">

                <!-- Name + Message -->
                <div id="guestbook-form" style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
                    <div>
                        <label for="guest-name" style="display: block;">Your name:</label>
                        <input id="guest-name"
                               placeholder="your name..."
                               type="text"
                               maxlength="20"
                               style="padding: 0.3rem 0.5rem; font-family: inherit; font-size: 1rem;">
                    </div>

                    <div style="flex: 1;">

                        <label for="guest-text"
                               style="display: block;">short message:</label>
                        <textarea id="guest-text"
                               type="text"
                               placeholder="write a message!!"
                               maxlength="280"
                               style="width: 100%; padding: 0.3rem 0.5rem; font-family: inherit; font-size: 1rem;"></textarea>
                    </div>
                </div>

                <!-- Draggable Icons -->
                <div id="guestbook-icons" style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                    <!-- Each of these <div> can be replaced with an <img> or a styled SVG. -->
                    <div class="guestbook-icon" draggable="true" data-icon="star"
                         style="width: 40px; height: 40px; background: gold; clip-path: polygon(
             50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%,
             2% 35%, 39% 35%); cursor: grab;"
                         title="Star"></div>

                    <div class="guestbook-icon" draggable="true" data-icon="heart"
                         style="width: 40px; height: 40px; background: hotpink; clip-path: polygon(
             50% 93%, 0% 46%, 12% 15%, 37% 15%, 50% 40%, 63% 15%, 88% 15%, 100% 46%); cursor: grab;"
                         title="Heart"></div>

                    <div class="guestbook-icon" draggable="true" data-icon="flower"
                         style="width: 40px; height: 40px; background: lavender;
                  border-radius: 50%;
                  box-shadow: inset 0 0 0 2px purple;
                  position: relative; cursor: grab;"
                         title="Flower">
                        <!-- simple “flower” dibs: four petal circles -->
                        <div style="position: absolute; top: 0; left: 50%;
                    transform: translateX(-50%);
                    width: 20px; height: 20px;
                    background: pink; border-radius: 50%;"></div>
                        <div style="position: absolute; bottom: 0; left: 50%;
                    transform: translateX(-50%);
                    width: 20px; height: 20px;
                    background: pink; border-radius: 50%;"></div>
                        <div style="position: absolute; left: 0; top: 50%;
                    transform: translateY(-50%);
                    width: 20px; height: 20px;
                    background: pink; border-radius: 50%;"></div>
                        <div style="position: absolute; right: 0; top: 50%;
                    transform: translateY(-50%);
                    width: 20px; height: 20px;
                    background: pink; border-radius: 50%;"></div>
                        <div style="position: absolute; top: 50%; left: 50%;
                    transform: translate(-50%, -50%);
                    width: 15px; height: 15px;
                    background: yellow; border-radius: 50%;"></div>
                    </div>
                    <!-- You can add more “objects” here (e.g. a rainbow stripe, a moon, etc.) -->
                </div>

                <!-- Drop‐zone (a “canvas” over which icons will land) -->
                <div id="guestbook-dropzone"
                     style="position: relative; width: 100%; height: 400px;
                border: 2px dashed #ccc; border-radius: 8px;
                background: url('assets/images/piano-bar.png') center/cover no-repeat;">
                    <!-- existing entries (icons) will be appended here as absolute‐positioned <div> -->
                    <span style="position: absolute; top: 50%; left: 50%;
                   transform: translate(-50%, -50%);
                   color: #888; font-size: 1.2rem;">
        Drag any icon here →
      </span>
                </div>
            </div>
        </section>












    </div>


    <div class="hover-tooltip">

    </div>

    <script type="module" src="js/chat.js"></script>
    <script type="module" src="js/guestbook.js"></script>
    <script type="module" src="js/sidebar.js"></script>


</body>

</html>
